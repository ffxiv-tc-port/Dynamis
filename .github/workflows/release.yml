name: Release

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.10.1
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Lother/dalamud-tc-pin/releases/download/v12.0.2/dalamud-api12-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\xivlauncher\Addon\Hooks\dev\"
      - name: Restore dependencies
        run: dotnet restore
      - name: Build IPFD (Rust)
        working-directory: ipfd
        run: cargo build --release
      - name: Compute version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v'
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build plugin (No SMA)
        run: dotnet build Dynamis/Dynamis.csproj --configuration Release --nologo -p:Version=${{ env.VER }} -p:AssemblyVersion=${{ env.VER }} -p:FileVersion=${{ env.VER }}
      - name: write version into manifest (No SMA)
        shell: pwsh
        run: |
          $path = './Dynamis/bin/Release/Dynamis.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = "${{ env.VER }}"
          $json | ConvertTo-Json | Set-Content -Path $path
      - name: Archive (No SMA)
        run: Compress-Archive -Path Dynamis/bin/Release/* -DestinationPath Dynamis.zip
      - name: Build plugin (With SMA)
        run: dotnet build Dynamis/Dynamis.csproj --configuration ReleaseWithSMA --nologo -p:Version=${{ env.VER }} -p:AssemblyVersion=${{ env.VER }} -p:FileVersion=${{ env.VER }}
      - name: write version into manifest (With SMA)
        shell: pwsh
        run: |
          $path = './Dynamis/bin/ReleaseWithSMA/DynamisWithSMA.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = "${{ env.VER }}"
          $json | ConvertTo-Json | Set-Content -Path $path
      - name: Archive (With SMA)
        run: Compress-Archive -Path Dynamis/bin/ReleaseWithSMA/* -DestinationPath DynamisWithSMA.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            Dynamis.zip
            Dynamis/bin/Release/Dynamis.json
            DynamisWithSMA.zip
            Dynamis/bin/ReleaseWithSMA/DynamisWithSMA.json
          generate_release_notes: true
