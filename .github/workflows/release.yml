name: Release

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.10.1
        with:
          # ipfd/.cargo/config.toml 釘死 x86_64-pc-windows-gnu；self-hosted 機器沒有外部 gcc，
          # 只有 gnu host toolchain 自帶的 MinGW 連結器能連（msvc host 加 gnu target 會 E0463）。
          toolchain: stable-x86_64-pc-windows-gnu
          # rust-cache 的 post 步驟會清 CARGO_HOME/bin 裡「它沒記到」的檔——機器層 rustup 1.29 的代理是
          # symlink，rustup.exe 本體因此被當多餘檔刪掉，下一顆 job 直接 rustup: command not found。self-hosted 不需要這個快取。
          cache: false
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.x
            10.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          $pinUrl = 'https://github.com/ffxiv-tc-port/Dalamud/releases/download/dalamud-pin-v13.0.0.17/dalamud-api13-net9.zip'
          Invoke-WebRequest -Uri $pinUrl -OutFile dalamud-pinned.zip
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath dalamud-pinned.zip).Hash
          if ($sha -ne '1481704F4DACBE96070F7B306FF1CE4BD77DB69C19CD74969FE296643E49EB5B') { throw "pinned Dalamud SHA256 mismatch: $sha" }
          Expand-Archive -Force dalamud-pinned.zip "$env:RUNNER_TEMP\dalamud-pinned\"
      - name: Restore dependencies
        run: dotnet restore
      - name: Build IPFD (Rust)
        working-directory: ipfd
        run: cargo build --release
      - name: Compute version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v'
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build plugin (No SMA)
        run: dotnet build Dynamis/Dynamis.csproj --configuration Release --nologo -p:Version=${{ env.VER }} -p:AssemblyVersion=${{ env.VER }} -p:FileVersion=${{ env.VER }} -p:DalamudLibPath="$env:RUNNER_TEMP\dalamud-pinned\"
      - name: write version into manifest (No SMA)
        shell: pwsh
        run: |
          $path = './Dynamis/bin/Release/Dynamis.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = "${{ env.VER }}"
          $json | ConvertTo-Json | Set-Content -Path $path
      - name: 移除發佈檔裡的其他平台原生檔（No SMA）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimesDir = 'Dynamis/bin/Release/runtimes'

          # 這個組態沒有 PowerShell 相依，唯一會帶進來的其他平台資料夾是
          # browser（System.Text.Encodings.Web 的 WASM 版本，win-x64 用不到）。
          # 只留 win／win-x64，不點名其他資料夾一律刪，避免漏掉某個平台變體。
          if (Test-Path -LiteralPath $runtimesDir) {
              Get-ChildItem -LiteralPath $runtimesDir -Directory |
                  Where-Object { $_.Name -notin @('win', 'win-x64') } |
                  Remove-Item -Recurse -Force
          }
      - name: Archive (No SMA)
        run: Compress-Archive -Path Dynamis/bin/Release/* -DestinationPath Dynamis.zip
      - name: Build plugin (With SMA)
        run: dotnet build Dynamis/Dynamis.csproj --configuration ReleaseWithSMA --nologo -p:Version=${{ env.VER }} -p:AssemblyVersion=${{ env.VER }} -p:FileVersion=${{ env.VER }} -p:DalamudLibPath="$env:RUNNER_TEMP\dalamud-pinned\"
      - name: write version into manifest (With SMA)
        shell: pwsh
        run: |
          $path = './Dynamis/bin/ReleaseWithSMA/DynamisWithSMA.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = "${{ env.VER }}"
          $json | ConvertTo-Json | Set-Content -Path $path
      - name: 移除發佈檔裡的其他平台原生檔（With SMA）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimesDir = 'Dynamis/bin/ReleaseWithSMA/runtimes'

          # PowerShell（System.Management.Automation）的 nuget 包把 unix／linux／osx 與
          # win-arm、win-arm64、win-x86 的版本都帶進來；win-x64 用的是 win 資料夾裡
          # 受管理組件的那份（System.Management.Automation.dll 等在 win 底下也有一份），
          # 只留 win／win-x64，不點名其他資料夾一律刪，避免漏掉某個平台變體。
          if (Test-Path -LiteralPath $runtimesDir) {
              Get-ChildItem -LiteralPath $runtimesDir -Directory |
                  Where-Object { $_.Name -notin @('win', 'win-x64') } |
                  Remove-Item -Recurse -Force
          }
      - name: Archive (With SMA)
        run: Compress-Archive -Path Dynamis/bin/ReleaseWithSMA/* -DestinationPath DynamisWithSMA.zip
      - name: 帳號痕跡閘門（上傳前；needle 由 secret 提供，讀不到就不放行）
        shell: pwsh
        env:
          LEAK_GUARD_NEEDLE: ${{ secrets.LEAK_GUARD_NEEDLE }}
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          $n = "$env:LEAK_GUARD_NEEDLE".Trim().ToLowerInvariant()
          if ($n.Length -lt 4 -or $n -cnotmatch '^[a-z0-9_.-]+$') { throw "secret LEAK_GUARD_NEEDLE is empty or malformed (length $($n.Length)); refusing to upload" }
          $L = [Text.Encoding]::Latin1
          $cases = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          [void]$cases.Add($n); [void]$cases.Add($n.Substring(0, 1).ToUpperInvariant() + $n.Substring(1)); [void]$cases.Add($n.ToUpperInvariant())
          $pats = @(foreach ($c in $cases) { ,@($c, 1); ,@((-join ($c.ToCharArray() | ForEach-Object { [string]$_ + [char]0 })), 2) })
          $full = [int][Math]::Floor($n.Length / 3) * 3
          $b64 = @(foreach ($c in $cases) { [Convert]::ToBase64String($L.GetBytes($c.Substring(0, $full))) })
          function Get-Hits([byte[]]$raw, [int]$depth) {
            $s = $L.GetString($raw); $h = 0
            foreach ($p in $pats) {
              $i = $s.IndexOf($p[0], [StringComparison]::Ordinal)
              while ($i -ge 0) {
                if ($i -lt $p[1] -or $s[$i - $p[1]] -notmatch '[A-Za-z0-9_]') { $h++ }
                $i = $s.IndexOf($p[0], $i + 1, [StringComparison]::Ordinal)
              }
            }
            foreach ($b in $b64) { $i = $s.IndexOf($b, [StringComparison]::Ordinal); while ($i -ge 0) { $h++; $i = $s.IndexOf($b, $i + 1, [StringComparison]::Ordinal) } }
            if ($depth -lt 2 -and $raw.Length -ge 4 -and $raw[0] -eq 0x50 -and $raw[1] -eq 0x4B -and $raw[2] -eq 3 -and $raw[3] -eq 4) {
              $za = [IO.Compression.ZipArchive]::new([IO.MemoryStream]::new($raw), [IO.Compression.ZipArchiveMode]::Read)
              try {
                foreach ($e in $za.Entries) {
                  if ($e.Length -le 0 -or $e.Length -gt 300MB) { continue }
                  $ms = [IO.MemoryStream]::new(); $es = $e.Open()
                  try { $es.CopyTo($ms) } finally { $es.Dispose() }
                  $h += Get-Hits $ms.ToArray() ($depth + 1)
                }
              } finally { $za.Dispose() }
            } elseif ($depth -lt 2 -and $raw.Length -ge 2 -and $raw[0] -eq 0x1F -and $raw[1] -eq 0x8B) {
              $ms = [IO.MemoryStream]::new()
              $gz = [IO.Compression.GZipStream]::new([IO.MemoryStream]::new($raw), [IO.Compression.CompressionMode]::Decompress)
              try { $gz.CopyTo($ms) } finally { $gz.Dispose() }
              $h += Get-Hits $ms.ToArray() ($depth + 1)
            }
            return $h
          }
          $globs = @('Dynamis.zip', 'Dynamis/bin/Release/Dynamis.json', 'DynamisWithSMA.zip', 'Dynamis/bin/ReleaseWithSMA/DynamisWithSMA.json')
          $root = (Get-Location).Path
          $rxs = @(foreach ($g in $globs) { '^' + [Regex]::Escape($g.Replace('\', '/')).Replace('\*\*/', '(?:.*/)?').Replace('\*\*', '.*').Replace('\*', '[^/]*').Replace('\?', '[^/]') + '$' })
          $files = @(Get-ChildItem -LiteralPath $root -Recurse -File -Force | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length).TrimStart([char[]]'\/').Replace('\', '/')
            if ($rel -notmatch '(^|/)\.git/' -and @($rxs | Where-Object { $rel -match $_ }).Count -gt 0) { $_.FullName }
          })
          if ($files.Count -eq 0) { throw 'leak guard matched no release files; refusing to upload' }
          $bad = 0
          foreach ($f in $files) {
            $c = Get-Hits ([IO.File]::ReadAllBytes($f)) 0
            if ($c -gt 0) { $bad++; Write-Host "::error::leak guard hit: $([IO.Path]::GetFileName($f)) real=$c" }
          }
          if ($bad -gt 0) { throw "leak guard blocked $bad file(s)" }
          Write-Host "leak guard clean: $($files.Count) file(s)"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            Dynamis.zip
            Dynamis/bin/Release/Dynamis.json
            DynamisWithSMA.zip
            Dynamis/bin/ReleaseWithSMA/DynamisWithSMA.json
          generate_release_notes: true
