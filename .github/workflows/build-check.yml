name: Build Check

on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.10.1
        with:
          # 與 release.yml 同：ipfd 釘死 gnu target，self-hosted 上只有 gnu host toolchain 自帶的連結器能連。
          toolchain: stable-x86_64-pc-windows-gnu
          # 同 release.yml：rust-cache 的 post 步驟會把機器層 rustup.exe 本體清掉。
          cache: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.x
            10.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          $pinUrl = 'https://github.com/ffxiv-tc-port/Dalamud/releases/download/dalamud-pin-v13.0.0.17/dalamud-api13-net9.zip'
          Invoke-WebRequest -Uri $pinUrl -OutFile dalamud-pinned.zip
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath dalamud-pinned.zip).Hash
          if ($sha -ne '1481704F4DACBE96070F7B306FF1CE4BD77DB69C19CD74969FE296643E49EB5B') { throw "pinned Dalamud SHA256 mismatch: $sha" }
          Expand-Archive -Force dalamud-pinned.zip "$env:RUNNER_TEMP\dalamud-pinned\"
      - name: Restore dependencies
        run: dotnet restore
      - name: Build IPFD (Rust)
        working-directory: ipfd
        run: cargo build --release
      - name: Build plugin (No SMA)
        run: dotnet build Dynamis/Dynamis.csproj --configuration Release --nologo -p:DalamudLibPath="$env:RUNNER_TEMP\dalamud-pinned\"
      - name: Build plugin (With SMA)
        run: dotnet build Dynamis/Dynamis.csproj --configuration ReleaseWithSMA --nologo -p:DalamudLibPath="$env:RUNNER_TEMP\dalamud-pinned\"
